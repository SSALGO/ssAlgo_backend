        function addRow() {
            const table = document.getElementById("optionsTable").getElementsByTagName("tbody")[0];
            const row = table.insertRow();
            row.innerHTML = `
                <td>
                    <select name="ooption" required class="form-control form-control-sm">
                        <option value="CE">CE</option>
                        <option value="PE">PE</option>
                        <option value="FUT">FUT</option>
                    </select>
                </td>
                <td>
                    <input
                            required
                              class="form-control form-control-sm"
                              id="ostrike"
                              name="ostrike"
                              required="True"
                                    type="number"
                                    min="-50"
                                    max="50"
                              value="1"
                            />
                </td>
                <td>
                    <select name="oside" required class="form-control form-control-sm">
                        <option value="BUY">BUY</option>
                        <option value="SELL">SELL</option>
                    </select>
                </td>
                <td>
                    <select name="oexpiry" required class="form-control form-control-sm">
                        <option value="Current Week">Current Week</option>
                        <option value="Next Week">Next Week</option>
                        <option value="Current Month">Current Month</option>
                        <option value="Next Month">Next Month</option>
                    </select>
                </td>

                    <td>
                        <input
                            required
                              class="form-control form-control-sm"
                              id="olot"
                              name="olot"
                              required="True"
                                    type="number"
                                    min="1"
                              value="1"
                            />
                    </td>
                <td>
                    <button type="button" onclick="deleteRow(this)">Delete</button>
                </td>
            `;
        }

        function deleteRow(button) {
            const row = button.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }
    </script>
        <script type="09bdecaf2d557f0c9e6f5d25-text/javascript">

        function fetchPrice() {
            const symbol = document.getElementById("symbol").value;
            fetch("/prices")
                .then(response => response.json())
                .then(data => {
                    const price = data[symbol];
                    if (price !== undefined) {
                        //document.getElementById("trigger_price").value = price;
                        console.log("Price fetched successfully:", price);
                    } else {
                        alert("Price not found for selected symbol.");
                    }
                })
                .catch(error => console.error("Error fetching prices:", error));

            const symbolSelect = document.getElementById("symbol");
            const selectedValue = symbolSelect.value;
            const dynamicSymbols = ["SILVERM", "CRUDEOIL", "CRUDEOILM", "NATURALGAS", "ZINC", "COPPER", "MCXMETLDEX", "NATGASMINI", "GOLDM", "SILVER", "MCXBULLDEX", "GOLD", "STEELREBAR", "LEADMINI", "ZINCMINI", "LEAD", "ALUMINIUM", "MENTHAOIL", "ALUMINI", "NICKEL", "KAPAS", "SILVERMIC", "GOLDPETAL", "GOLDGUINEA", "GOLDTEN", "COTTONOIL", "COTTONCNDY"];
            
            const startTimeInput = document.getElementById("StartTime");
            const exitTimeInput = document.getElementById("ExitTime");
            const afterentrytime=document.getElementById("afterentrytime");
            const exitatTime=document.getElementById("ExitatTime");
            // Update StartTime and ExitTime if selected symbol is in dynamicSymbols
            if (dynamicSymbols.includes(selectedValue)) {
                startTimeInput.value = "09:05";
                exitTimeInput.value = "23:40";
                afterentrytime.value="09:05";
                exitatTime.value="23:40";
            }
            else {
                // Update StartTime and ExitTime for static options
                startTimeInput.value = "09:17";
                exitTimeInput.value = "15:20";
                afterentrytime.value="09:17";
                exitatTime.value="15:20";
            }
        }
        
    </script>

    function toggleExpiryOptions() {
        var optionType = document.getElementById('option_type').value;
        var expirySelect = document.getElementById('expiry');
        var options = expirySelect.options;

        for (var i = 0; i < options.length; i++) {
            options[i].style.display = 'block';
        }

        if (optionType === 'FUT') {
            for (var i = 0; i < options.length; i++) {
                if (options[i].value === 'CurrentWeek' || options[i].value === 'NextWeek') {
                    options[i].style.display = 'none';
                }
            }
        }
    }

    // Call the function on page load to set the correct options based on the current selection
    document.addEventListener('DOMContentLoaded', toggleExpiryOptions);

    window.onload = function() {
      
        toggleStrikeOptions();
