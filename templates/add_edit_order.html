{% extends 'base.html' %} {% block content %}
    <div class="container mt-4">
      <h2>{% if order %}Edit Order{% else %}Add Order{% endif %}</h2>
      <form method="post" action="{{ action_url }}">
        {% if order %}
        <div class="form-group">
          <label for="_id">ID:</label>
          <input
            type="text"
            class="form-control"
            id="_id"
            name="_id"
            value="{% if order %}{{ order['_id'] }}{% endif %}"
            {%
            if
            order
            %}readonly{%
            endif
            %}
          />
        </div>
        {% endif %}
        <div class="form-group">
          <label for="time">Time:</label>
          <input
            type="text"
            class="form-control"
            id="time"
            name="time"
            value="{% if order %}{{ order['time'] }}{% endif %}"
            {%
            if
            order
            %}readonly{%
            endif
            %}
          />
        </div>
        <div class="form-group">
          <label for="symbol">Symbol:</label>
          <input
            type="text"
            class="form-control"
            id="symbol"
            name="symbol"
            value="{% if order %}{{ order['symbol'] }}{% endif %}"
          />
        </div>
        <div class="form-group">
          <label for="trigger_type">Trigger Type:</label>
          <input
            type="text"
            class="form-control"
            id="trigger_type"
            name="trigger_type"
            value="{% if order %}{{ order['trigger_type'] }}{% endif %}"
          />
        </div>
        <div class="form-group">
          <label for="trigger_price">Trigger Price:</label>
          <input
            type="text"
            class="form-control"
            id="trigger_price"
            name="trigger_price"
            value="{% if order %}{{ order['trigger_price'] }}{% endif %}"
          />
        </div>
        <div class="form-group">
          <label for="option_type">Option Type:</label>
          <input
            type="text"
            class="form-control"
            id="option_type"
            name="option_type"
            value="{% if order %}{{ order['option_type'] }}{% endif %}"
          />
        </div>
        <button type="submit" class="btn btn-primary">
          {% if order %}Save Changes{% else %}Add Order{% endif %}
        </button>
      </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
 {% endblock %}
