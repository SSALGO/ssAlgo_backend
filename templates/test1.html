<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Stock Chart</title>
    <!-- Include Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <!-- Input fields for stock symbol and date range -->
    <label for="symbol">Stock Symbol:</label>
    <input type="text" id="symbol" value="AAPL">
    
    <label for="start-date">Start Date:</label>
    <input type="date" id="start-date" value="2022-01-01">
    
    <label for="end-date">End Date:</label>
    <input type="date" id="end-date" value="2023-01-01">
    
    <!-- Container for the Plotly chart -->
    <div id="stock-chart"></div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get input elements
            var symbolInput = document.getElementById('symbol');
            var startDateInput = document.getElementById('start-date');
            var endDateInput = document.getElementById('end-date');

            // Initial values
            var symbol = symbolInput.value;
            var startDate = startDateInput.value;
            var endDate = endDateInput.value;

            // Update chart on input change
            symbolInput.addEventListener('change', updateChart);
            startDateInput.addEventListener('change', updateChart);
            endDateInput.addEventListener('change', updateChart);

            // Initial chart rendering
            updateChart();

            // Function to update the chart
            function updateChart() {
                // Update values from input fields
                symbol = symbolInput.value;
                startDate = startDateInput.value;
                endDate = endDateInput.value;

                // Generate random stock data (replace with your data-fetching logic)
                var data = generateRandomData(startDate, endDate);

                // Create a Plotly chart
                var trace = {
                    x: data.dates,
                    y: data.prices,
                    type: 'scatter',
                    mode: 'lines',
                    name: symbol
                };

                var layout = {
                    title: 'Stock Chart for ' + symbol,
                    xaxis: {
                        title: 'Date'
                    },
                    yaxis: {
                        title: 'Stock Price'
                    }
                };

                var config = {
                    responsive: true
                };

                // Add an event listener for point click
                var clickHandler = function (event) {
                    var pointIndex = event.points[0].pointIndex;
                    var clickedDate = data.dates[pointIndex];
                    var clickedPrice = data.prices[pointIndex];

                    alert('Clicked on ' + clickedDate + ' with price ' + clickedPrice);
                };

                Plotly.newPlot('stock-chart', [trace], layout, config).then(function(gd) {
                    gd.on('plotly_click', clickHandler);
                });
            }

            // Placeholder function to generate random stock data
            function generateRandomData(startDate, endDate) {
                var dateRange = getDateRange(startDate, endDate);
                var dates = dateRange.map(function (date) {
                    return date.toISOString().split('T')[0];
                });

                var prices = Array.from({ length: dates.length }, function () {
                    return Math.random() * 100; // Random prices for demonstration
                });

                return {
                    dates: dates,
                    prices: prices
                };
            }

            // Helper function to get date range between two dates
            function getDateRange(startDate, endDate) {
                var start = new Date(startDate);
                var end = new Date(endDate);
                var dateRange = [];

                while (start <= end) {
                    dateRange.push(new Date(start));
                    start.setDate(start.getDate() + 1);
                }

                return dateRange;
            }
        });
    </script>
</body>
</html>
