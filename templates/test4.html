<head>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    /* Style for the modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0,0,0);
      background-color: rgba(0,0,0,0.4);
      padding-top: 60px;
    }

    /* Style for the modal content */
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }

    /* Style for the close button */
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="graph"></div>

  <!-- Modal for Buy/Sell options -->
  <div id="myModal" class="modal">
    <div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>

    <!-- Your existing modal content -->
    <p>Current Price: <span id="modalPrice"></span></p>
    <button onclick="buy()">Buy</button>
    <button onclick="sell()">Sell</button>

    <!-- Form for adding/editing orders -->
    <div class="container mt-4">
      <h2>{% if order %}Edit Order{% else %}Add Order{% endif %}</h2>
      <form method="post" action="{{ action_url }}">
        <div class="row">

          {% if order %}
            <div class="col">
              <div class="md-form">
                <label for="_id" class="form-control-sm">ID</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="_id"
                  name="_id"
                  value="{% if order %}{{ order['_id'] }}{% endif %}"
                  readonly
                />
              </div>
            </div>

            <div class="col">
              <div class="md-form">
                <label for="time" class="form-control-sm">Time</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="time"
                  name="time"
                  value="{% if order %}{{ order['time'] }}{% endif %}"
                  readonly
                />
              </div>
            </div>
          {% endif %}

          <div class="col">
            <div class="md-form">
              <label for="symbol" class="form-control-sm">Symbol</label>
              {% if order %}
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="symbol"
                  name="symbol"
                  value="{% if order %}{{ order['symbol'] }}{% endif %}"
                  readonly
                />
              {% else %}
                <select class="form-control form-control-sm" id="symbol" name="symbol">
                  <option value="BANKNIFTY" {% if order and order['symbol'] == "BANKNIFTY" %} selected {% endif %}>BANKNIFTY</option>
                  <option value="NIFTY" {% if order and order['symbol'] == 'NIFTY' %} selected {% endif %}>NIFTY</option>
                  <option value="FINNIFTY" {% if order and order['symbol'] == 'FINNIFTY' %} selected {% endif %}>FINNIFTY</option>
                  <option value="CRUDEOIL" {% if order and order['symbol'] == 'CRUDEOIL' %} selected {% endif %}>CRUDEOIL</option>
                </select>
              {% endif %}
            </div>
          </div>

          <!-- Add other form fields as needed -->

          <div class="col">
            <div class="md-form">
              <label class="form-control-sm" for="trailCheckbox">Trail</label>
              <br />
              <input type="checkbox" class="form-control-sm" name="trail" id="trailCheckbox" value="1" {% if order and order['trail']==1 %} checked {% endif %} />
              <input type="hidden" class="form-control-sm" name="trail" id="trailHidden" value="0" />
            </div>
          </div>

          <!-- Add other form fields as needed -->

          <div class="col">
            <div class="md-form">
              <label class="form-control-sm">Submit</label>
              <button type="submit" class="btn btn-primary btn-sm">
                {% if order %}Save{% else %}Add Order{% endif %}
              </button>
            </div>
          </div>

        </div>
      </form>
    </div>

  </div>
</div>
  </div>
</body>
<script>
  // Import the Plotly library
  var gd = document.getElementById('graph');

  // Generate random stock-like data for the last 3 months
  var startDate = new Date();
  startDate.setMonth(startDate.getMonth() - 3);
  var dates = [];
  var prices = [];

  for (var i = 0; i < 90; i++) {
    var date = new Date(startDate);
    date.setDate(startDate.getDate() + i);
    dates.push(date.toISOString().split('T')[0]);
    prices.push(Math.random() * 1000); // Random stock-like prices
  }

  // Create a candlestick chart with the generated data
  var trace = {
    type: 'candlestick',
    x: dates,
    open: prices.map(function () { return Math.random() * 1000; }),
    high: prices.map(function () { return Math.random() * 1000 + 100; }),
    low: prices.map(function () { return Math.random() * 1000 - 100; }),
    close: prices.map(function () { return Math.random() * 1000; })
  };

  var layout = {
    title: 'Random Stock Chart',
    xaxis: {
      rangeslider: {
        visible: false
      }
    },
    yaxis: {
      title: 'Stock Price'
    }
  };

  // Create the plot with the candlestick trace and layout
  Plotly.newPlot(gd, [trace], layout).then(attach);

  // Function to attach click event listener
  function attach() {
    // Extract y axis and margins from the plot layout
    var yaxis = gd._fullLayout.yaxis;
    var t = gd._fullLayout.margin.t;

    // Add a click event listener to the plot
    gd.addEventListener('click', function(evt) {
      // Convert pixel coordinates to data coordinates
      var yInDataCoord = yaxis.p2c(evt.y - t);

      // Update the plot title with the clicked coordinates
      Plotly.relayout(gd, 'title', 'y: ' + yInDataCoord);

      // Open the modal with the current price
      openModal(yInDataCoord);
    });
  }

  // Function to open the modal
  function openModal(price) {
    document.getElementById('modalPrice').innerText = price.toFixed(2);
    document.getElementById('myModal').style.display = 'block';
  }

  // Function to close the modal
  function closeModal() {
    document.getElementById('myModal').style.display = 'none';
  }

  // Function to handle the buy action
  function buy() {
    alert('Buy action executed.');
    closeModal();
  }

  // Function to handle the sell action
  function sell() {
    alert('Sell action executed.');
    closeModal();
  }
</script>
