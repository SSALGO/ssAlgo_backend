<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Verification</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px;
            text-align: center;
        }

        .success-message {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .warning-message {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    {% if not data.status %}
        <div class="container success-message">
            <h1 class="display-4">Payment was successful and verified</h1>
            <h3 class="lead">Please store the data for future reference</h3>
            <div class="mt-3">
                <strong>Payment ID:</strong> {{ data.payment_id }}
            </div>
            <div>
                <strong>Order ID:</strong> {{ data.order_id }}
            </div>
        </div>
    {% else %}
        <div class="container warning-message">
            <h1 class="display-4">Payment was successful but not verified</h1>
        </div>
    {% endif %}
    <div class="mt-4">
        <form action="{{ url_for('index') }}">
            <button type="submit" class="btn btn-primary">Home</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
